[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harvestguard-api"
version = "1.0.0"
description = "AI-Powered Food Insecurity Early Warning System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "anthropic>=0.28.0",
    "geopandas>=0.14.0",
    "rasterio>=1.3.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "shapely>=2.0.0",
    "earthaccess>=0.9.0",
    "apscheduler>=3.10.0",
    "redis>=5.0.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.9",
    "pyproj>=3.6.0",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
